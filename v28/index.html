<style>
/* Concept: 뷰파인더. 게임 화면은 카메라 프레임(모서리 브래킷), HUD는 노출 정보처럼 조용하게. 강조색은 플래시 빛 하나. */
:root{
  --bg:#0F1114;
  --surface:#181B20;
  --line:#2A2F37;
  --text:#F3F4F6;
  --dim:#8B93A1;
  --flash:#FFF1B8;
  --warn:#FF6B57;
  --display:'Bricolage Grotesque','Noto Sans KR','Noto Sans JP','Noto Sans SC','Noto Sans TC',system-ui,sans-serif;
  --body:'Noto Sans KR','Noto Sans JP','Noto Sans SC','Noto Sans TC',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:linear-gradient(#171A20,var(--bg) 220px) var(--bg);color:var(--text);font-family:var(--body);
  padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px);
  overflow-x:hidden;
}
.app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:stretch;gap:0}
.col{
  width:100%;min-width:0;
}
.hud{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.rank{min-width:0}
.rank .row{display:flex;align-items:baseline;gap:8px}
.rank .name{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.2}
.rank .rp{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--flash);border-radius:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.score{text-align:right}
.score .v{display:block;font-family:var(--display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.score .sub{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:5px;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.lives{display:flex;gap:4px;align-items:center}
.lives i{width:8px;height:8px;border-radius:50%;background:var(--text);display:block}
.lives i.off{background:var(--line)}
.panel{position:relative;margin:0;background:#000;line-height:0}
.panel::after{
  content:"";position:absolute;inset:-7px;pointer-events:none;
  background:
    linear-gradient(var(--text),var(--text)) top left/18px 2px no-repeat,
    linear-gradient(var(--text),var(--text)) top left/2px 18px no-repeat,
    linear-gradient(var(--text),var(--text)) top right/18px 2px no-repeat,
    linear-gradient(var(--text),var(--text)) top right/2px 18px no-repeat,
    linear-gradient(var(--text),var(--text)) bottom left/18px 2px no-repeat,
    linear-gradient(var(--text),var(--text)) bottom left/2px 18px no-repeat,
    linear-gradient(var(--text),var(--text)) bottom right/18px 2px no-repeat,
    linear-gradient(var(--text),var(--text)) bottom right/2px 18px no-repeat;
}
canvas{display:block;width:100%;height:auto;aspect-ratio:9/16;touch-action:none;-webkit-user-select:none;user-select:none;cursor:none}
.ov{position:absolute;inset:0;display:flex;align-items:flex-end;padding:10px;line-height:1.5;pointer-events:none;z-index:1}
.card{
  pointer-events:auto;width:100%;background:rgba(15,17,20,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:16px;
  padding:18px 16px 14px;display:flex;flex-direction:column;gap:8px;
}
.ov:not([hidden]) .card{animation:rise .26s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.kick{margin:0;font-size:12px;color:var(--dim);font-weight:500}
.card h2{margin:0;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.card .body{margin:0;font-size:13px;color:#C9CED8;text-wrap:pretty;white-space:pre-line}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.cap{display:inline-grid;place-items:center;width:20px;height:14px;border-radius:7px;color:#0F1114;font-size:9px;font-weight:700;line-height:1}
.th{position:relative;width:48px;height:48px;border:1px solid var(--line);border-radius:6px;background:#000;line-height:0}
.th img{width:100%;height:100%;object-fit:cover;display:block;border-radius:5px}
.th button{position:absolute;top:-9px;right:-9px;min-height:0;width:20px;height:20px;padding:0;font-size:10px;border-radius:50%;line-height:1;background:var(--bg);justify-content:center}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
button,label.btn{
  display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:14px;font-weight:700;color:var(--text);background:transparent;
  border:1px solid var(--line);border-radius:12px;padding:0 14px;cursor:pointer;min-height:46px;flex:1 1 auto;
}
button:hover,label.btn:hover{border-color:var(--dim)}
button:focus-visible,label.btn:focus-within,label.btn:focus-visible{outline:2px solid var(--flash);outline-offset:2px}
button.primary,label.btn.primary{flex:1 1 100%;background:var(--flash);color:#15181D;border-color:var(--flash);font-size:15px;min-height:50px}
button.primary:hover,label.btn.primary:hover{background:#fff;border-color:#fff}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.tools{display:flex;gap:12px;align-items:center;justify-content:space-between}
.tools .btns{margin:0;flex-wrap:nowrap;gap:6px}
.tools button{flex:0 0 auto;width:40px;height:40px;min-height:0;padding:0;border-radius:50%;color:var(--dim)}
.tools button:hover{color:var(--text)}
.tools svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bMute .x{display:none}#bMute.off .x{display:inline}#bMute.off .w{display:none}
.clipv{align-self:center;height:min(34vh,230px);aspect-ratio:9/16;border-radius:10px;background:#000;object-fit:cover;border:1px solid var(--line)}
.hint{margin:0;font-size:12px;color:var(--dim);line-height:1.4}
.hud{padding:8px 14px 6px}
.capin{width:100%;min-height:46px;padding:0 14px;font:inherit;font-size:15px;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;outline:none}
.capin:focus{border-color:var(--flash)}
.col:nth-child(2){flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size;background:#000}
.col:nth-child(2) canvas{width:min(100cqw,calc(100cqh*var(--ar,.5625)));height:auto}
.panel::after{display:none}
.col:nth-child(3){padding:4px 14px 8px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}.ov:not([hidden]) .card{animation:none}.bar i{transition:none}}
/* ===== v15 시안 스타일: 따뜻한 크림 카드 + 노란 버튼 ===== */
body{background:linear-gradient(#1D2740,#0F1420 260px) #0F1420}
.bar i{background:linear-gradient(90deg,#FFB020,#FF7A1A)}
.card{background:#FFF8EC;color:#4A2C12;border:2px solid #F3D9A8;border-radius:24px;box-shadow:0 10px 28px rgba(0,0,0,.4);-webkit-backdrop-filter:none;backdrop-filter:none;padding:20px 16px 16px}
.kick{color:#A3784A;font-weight:700}
.card h2{color:#4A2C12;font-family:'Jua',var(--display);font-weight:400;font-size:32px}
.card .body{color:#6B4A2B}
.legend{color:#8A6540}
.card button,.card label.btn{background:#fff;color:#4A2C12;border:2px solid #F0DDB8;border-radius:16px}
.card button:hover,.card label.btn:hover{border-color:#E0B96B}
.card button.primary,.card label.btn.primary{background:linear-gradient(#FFDF58,#F5A100);color:#4A2C12;border:2px solid #F5A100;border-radius:28px;box-shadow:0 4px 0 #C27A00;font-size:19px;min-height:58px;font-family:'Jua',var(--body);font-weight:400}
.card button.primary:active,.card label.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #C27A00}
.th{border:2px solid #F0DDB8;background:#fff;border-radius:10px}
.th img{border-radius:8px}
.th button{background:#fff!important;color:#4A2C12!important;border:2px solid #F0DDB8!important}
.th.big{width:72px;height:72px}
.clipv{border:2px solid #F0DDB8}
.tabs{display:flex;gap:0;background:#F3E6CC;border-radius:14px;padding:3px}
.card .tabs button{flex:1;min-height:40px;border:0;border-radius:11px;background:transparent;color:#8A6540;font-size:14px}
.card .tabs button.on{background:#7A4A22;color:#fff}
#oL{display:flex;flex-wrap:wrap;gap:10px}
.ov.title{align-items:stretch;padding:0;background:linear-gradient(#2F7BD9 0%,#6EC1F0 38%,#A8D98A 72%,#7DBB5C 100%);overflow:hidden}
.ov.title .card{background:transparent;border:0;box-shadow:none;padding:34px 20px 18px;align-items:center;text-align:center;justify-content:flex-start;gap:12px;height:100%;position:relative;z-index:2}
.ov.title .kick,.ov.title h2,.ov.title .body,.ov.title .legend{display:none}
.tlogo{display:flex;flex-direction:column;align-items:center;line-height:1}
.tlogo b{font-family:'Jua',var(--display);font-weight:400;font-size:58px;letter-spacing:-.02em;color:#FFB020;-webkit-text-stroke:7px #fff;paint-order:stroke fill;text-shadow:0 5px 0 #C27A00,0 8px 14px rgba(0,0,0,.3)}
.tlogo b i{font-style:normal;color:#3FA0FF}
.tlogo small{margin-top:10px;font:800 14px var(--display);letter-spacing:.18em;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.45)}
.tframe{flex:1 1 0;min-height:0;display:grid;place-items:center;width:100%}
.tframe div{background:#fff;padding:10px 10px 28px;border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.35);transform:rotate(-3deg);width:min(40%,170px)}
.tframe img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px}
.tsub{margin:0;font-weight:700;font-size:15px;line-height:1.45;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5);text-wrap:balance}
.ov.title .btns{width:100%}
.ticons{display:flex;gap:26px;justify-content:center;margin-top:4px}
.ov.title .card .ticons button{flex:0 0 auto;width:auto;min-height:0;background:transparent;border:0;color:#fff;font-size:12px;font-weight:700;display:flex;flex-direction:column;gap:2px;text-shadow:0 2px 4px rgba(0,0,0,.5);padding:2px 6px}
.ticons em{font-style:normal;font-size:24px}
.cube{position:absolute;width:34px;height:34px;border-radius:7px;background:linear-gradient(135deg,#FFC15A,#D9791B);box-shadow:inset -4px -4px 0 rgba(0,0,0,.15),0 6px 10px rgba(0,0,0,.25);z-index:1}


.tools4{display:flex;gap:8px;width:100%}
.ov.title .card .tools4 button{flex:1;min-height:56px;border-radius:16px;background:rgba(255,255,255,.88);color:#4A2C12;border:2px solid #fff;font-size:13px;display:flex;flex-direction:column;gap:0;padding:4px 2px;text-shadow:none}
.ov.title .card .tools4 button.on{background:linear-gradient(#FFDF58,#F5A100);border-color:#C27A00;box-shadow:0 3px 0 #C27A00}
.tools4 em{font-style:normal;font-size:20px;line-height:1.1}
.tdesc{margin:0;font-size:12px;font-weight:700;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.th.lock img{filter:brightness(0);opacity:.35}
.th .stars{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font:700 11px var(--body);color:#C27A00;line-height:1.2;background:rgba(255,255,255,.9);border-radius:0 0 8px 8px}
.ov.title .card .ticons{gap:14px}
@media (max-height:700px){.tsub{display:none}.tframe div{width:min(30%,120px);padding:6px 6px 16px}.tlogo b{font-size:46px}.ov.title .card{padding-top:22px;gap:8px}}
</style>

  for(var r=r0;r<=r1;r++){for(var c=c0;c<=c1;c++){
    var br=grid[r*COLS+c];if(!br||!br.alive)continue;
    var cx=clamp(b.x,br.x,br.x+BW),cy=clamp(b.y,br.y,br.y+BH);
    var dx=b.x-cx,dy=b.y-cy,d=dx*dx+dy*dy;
    if(d<=BR*BR&&d<bd){best=br;bd=d;bx=dx;by=dy;}
  }}

    b.x+=nx*(pen+.01);b.y+=ny*(pen+.01);

function step(dt){

  var pwT=wideT>0?112:72;pw+=(pwT-pw)*Math.min(1,dt*10);
  px=clamp(px,1.5,W-1.5);
  if(wideT>0)wideT-=dt;if(slowT>0)slowT-=dt;if(pierceT>0)pierceT-=dt;
  if(rapidT>0)rapidT-=dt;
  if(state==='play'){
    fireCd-=dt;
    if((firing||pendFire>0)&&fireCd<=0){
      pendFire=0;
      fireCd=TOOLS[toolIdx].cd*(rapidT>0?.55:1);
      if(gunMode===3){[-1,0,1].forEach(function(k){shots.push({x:clamp(px+k*10,1,W-1),y:PY-PH/2-4,vx:k*55});});}
      else if(gunMode===2){[-1,1].forEach(function(k){shots.push({x:clamp(px+k*8,1,W-1),y:PY-PH/2-4,vx:0});});}
      else shots.push({x:px,y:PY-PH/2-4,vx:0});
      gunSound();
    }
  }
  for(var si=shots.length-1;si>=0;si--){
    var sh=shots[si];sh.y-=760*dt;sh.x+=sh.vx*dt;
    if(sh.y<TOP-4||sh.x<-4||sh.x>W+4){shots.splice(si,1);continue;}
    var sc=Math.floor(sh.x/BW),sr=Math.floor((sh.y-TOP)/BH);
    if(sr>=0&&sr<ROWS&&sc>=0&&sc<COLS){
      var sb=grid[sr*COLS+sc];
      if(sb&&sb.alive){
        shots.splice(si,1);hitBrick(sb);if(hits>0)hits--;
        TOOLS[toolIdx].area.forEach(function(o){
          var rr2=sr+o[0],cc2=sc+o[1];
          if(rr2<0||rr2>=ROWS||cc2<0||cc2>=COLS)return;
          var nb=grid[rr2*COLS+cc2];
          if(nb&&nb.alive&&!nb.queued){nb.queued=true;blasts.push({b:nb,t:.02+.008*Math.abs(o[1]),d:2,w:1});}
        });
      }
    }
  }
  var sp=spd(),i;
  for(i=0;i<balls.length;i++){
    var b=balls[i];
    if(b.stuck){b.x=px;b.y=PY-PH/2-BR;continue;}
    var m=Math.hypot(b.vx,b.vy)||1,k=sp/m;b.vx*=k;b.vy*=k;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    b.tc=(b.tc||0)+1;if(b.tc%3===0){b.trail=b.trail||[];b.trail.push({x:b.x,y:b.y});if(b.trail.length>9)b.trail.shift();}

    else if(b.x>W-BR){b.x=W-BR;b.vx=-Math.abs(b.vx);tone(300,.04,'square',.03);}
    if(b.y<BR){b.y=BR;b.vy=Math.abs(b.vy);tone(300,.04,'square',.03);}
    if(b.vy>0&&b.y+BR>=PY-PH/2&&b.y-BR<=PY+PH/2&&Math.abs(b.x-px)<=pw/2+BR){
      var hp=clamp((b.x-px)/(pw/2),-1,1),a=hp*60*Math.PI/180;
      b.vx=Math.sin(a)*sp;b.vy=-Math.cos(a)*sp;b.y=PY-PH/2-BR;combo=0;
      tone(230,.07,'triangle',.07);
    }
    if(b.y<TOP+FH+BR)collideBricks(b);
  }
  balls=balls.filter(function(b){return b.stuck||b.y<=H+20;});
  for(i=0;i<items.length;i++){
    var it=items[i];it.y+=120*dt;
    if(it.y+9>=PY-PH/2&&it.y-9<=PY+PH/2&&Math.abs(it.x-px)<=pw/2+14){applyItem(it.t);it.dead=true;}

    if(broken/total>=.75){clearStage();return;}

      el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click();}});
      el.addEventListener('click',function(){audio();if(bt.fn)bt.fn();});
    }else{
      el.type='button';el.className=bt.primary?'primary':'';
      el.addEventListener('click',function(){audio();bt.fn();});
    }
    el.textContent=bt.label;bx.appendChild(el);
  });
  $('ov').hidden=false;
  var f=bx.querySelector('button');if(f){try{f.focus({preventScroll:true});}catch(e){}}
}
function showTitle(){
  state='title';
  var pg0=getProg(),di0=dailyInfo();
  showCard({kicker:'',title:'',body:'',buttons:[{label:(pg0>0?'▶ 이어하기 · '+(pg0+1)+'관문':'▶ 시작하기'),primary:true,fn:startBase},{label:di0.done?'📅 오늘의 사진 ✔ 완료':'📅 오늘의 사진',fn:startDaily},{label:'🗺 관문 지도',fn:showMap}]});
  var ov=$('ov'),card=ov.querySelector('.card'),bx=$('oBtns');ov.classList.add('title');
  function mk(tag,cls,html){var e=document.createElement(tag);e.className='tx '+(cls||'');if(html)e.innerHTML=html;return e;}
  card.insertBefore(mk('div','tlogo','<b>포토<i>블록</i></b><small>PHOTO BLOCK</small>'),card.firstChild);
  var fr=mk('div','tframe','<div><img alt=""></div>');fr.querySelector('img').src=pIm0.src;card.insertBefore(fr,bx);
  card.insertBefore(mk('p','tsub','움직여서 조준하고, 눌러서 발사!<br>블록을 깨고 소중한 사진을 만나보세요'),bx);
  var stp='';for(var si=0;si<7;si++)stp+=(si<((di0.sk>0)?((di0.sk-1)%7)+1:0)?'●':'○');
  card.insertBefore(mk('p','tdesc','출석 도장 '+stp+' · 연속 '+di0.sk+'일 · ★ '+starTotal()+'개'),bx);
  var tl=mk('div','tools4',''),td=mk('p','tdesc','');
  function selTool(k){if(starTotal()<TNEED[k]){td.textContent='별 '+TNEED[k]+'개를 모으면 열려요 (지금 '+starTotal()+'개)';return;}toolIdx=k;try{localStorage.setItem('pb-tool',String(k));}catch(e){}[].forEach.call(tl.children,function(b,i){b.className=i===k?'on':'';});td.textContent=TOOLS[k].n+' · '+TOOLS[k].d;}
  TOOLS.forEach(function(t,k){var b=document.createElement('button');b.type='button';var lk=starTotal()<TNEED[k];b.innerHTML='<em>'+(lk?'\ud83d\udd12':t.ic)+'</em>'+(lk?'\u2605'+TNEED[k]:t.n);if(lk)b.style.opacity='.55';b.addEventListener('click',function(){audio();selTool(k);});tl.appendChild(b);});
  card.insertBefore(tl,bx);card.insertBefore(td,bx);if(starTotal()<TNEED[toolIdx])toolIdx=0;selTool(toolIdx);
  var ic=mk('div','ticons','');
  [['🔊','소리',function(){var m=$('bMute');if(m)m.click();}],['🖼️','내 사진',function(){showSetup('mine');}]].forEach(function(a){
    var b=document.createElement('button');b.type='button';b.innerHTML='<em>'+a[0]+'</em>'+a[1];b.addEventListener('click',function(){audio();a[2]();});ic.appendChild(b);});
  card.appendChild(ic);
  [[8,20,-18],[78,26,22],[6,58,15],[84,62,-12],[44,3,10]].forEach(function(c){var q=mk('div','cube');q.style.left=c[0]+'%';q.style.top=c[1]+'%';q.style.transform='rotate('+c[2]+'deg)';ov.appendChild(q);});
}

function showCollection(){
  var col=getCol(),n=0;BASE.forEach(function(b){if(col[b.name])n++;});
  showCard({kicker:'도감',title:'모은 사진 '+n+'/'+BASE.length,body:'기본 사진을 클리어하면 사진이 채워져요. 빨리 깰수록 별이 많아요.',buttons:[{label:'뒤로',primary:true,fn:showTitle}]});
  var lg=$('oL');lg.hidden=false;lg.innerHTML='';
  BASE.forEach(function(m){var st=col[m.name]||0,d=document.createElement('div');d.className='th big'+(st?'':' lock');var im=document.createElement('img');im.src=m.th;im.alt=st?m.name:'아직 못 찾았어요';d.appendChild(im);
    var sp=document.createElement('span');sp.className='stars';sp.textContent=st?'\u2605\u2605\u2605'.slice(0,st)+'\u2606\u2606\u2606'.slice(0,3-st):'?';d.appendChild(sp);lg.appendChild(d);});
}
/* ---------- 내 사진 ---------- */
var mine=[],withBase=false;
function startAtStage(i){baseRun=true;holeMode=false;dailyRun=false;playlist=BASE.slice();startIdx=i;newGame();}
function startDaily(){var di=dailyInfo();baseRun=true;holeMode=false;dailyRun=true;playlist=[BASE[(di.d*7+3)%BASE.length]];startIdx=0;newGame();}
function startBase(){startAtStage(getProg());}
function showMap(){
  var col=getCol(),pg=getProg();
  showCard({kicker:'관문 지도',title:'진행 '+pg+'/'+BASE.length,body:'별 '+starTotal()+'개 · 열린 사진을 눌러 시작해요',buttons:[{label:'뒤로',primary:true,fn:showTitle}]});
  var lg=$('oL');lg.hidden=false;lg.innerHTML='';
  BASE.forEach(function(m,i){var st=col[m.name]||0,open=i<=pg,d=document.createElement('div');d.className='th big'+(open?'':' lock');var im=document.createElement('img');im.src=m.th;im.alt=open?m.name:'잠김';d.appendChild(im);
    var sp=document.createElement('span');sp.className='stars';sp.textContent=open?(st?'\u2605\u2605\u2605'.slice(0,st)+'\u2606\u2606\u2606'.slice(0,3-st):(i+1)+'관문'):'\ud83d\udd12';d.appendChild(sp);
    if(open)d.addEventListener('click',function(){audio();startAtStage(i);});lg.appendChild(d);});
}
function pickHole(){baseRun=false;holeMode=true;autoStart=true;mine=[];}
function pickFile(){baseRun=false;autoStart=false;holeMode=false;showSetup('mine');}
var setupTab='mine';
function showSetup(tab){baseRun=false;
  state='title';if(typeof tab==='string')setupTab=tab;
  var n=mine.length,bt=[],isBase=setupTab==='base';
  if(isBase){
    bt.push({label:'▶ 기본 사진으로 시작',primary:true,fn:startBase});
  }else if(n){
    bt.push({label:'▶ 벽돌로 만들기',primary:true,fn:startMine});
    bt.push({label:'사진 추가',pick:true,fn:function(){autoStart=false;}});
    bt.push({label:'기본 사진 '+(withBase?'포함':'제외'),fn:function(){withBase=!withBase;showSetup();}});
  }else{
    bt.push({label:'+ 사진 고르기',primary:true,pick:true,fn:function(){autoStart=false;}});
  }
  bt.push({label:'뒤로',fn:showTitle});
  showCard({kicker:'사진 선택',title:isBase?'기본 사진 '+BASE.length+'장':(n?n+'장 골랐어요':'사진을 골라주세요'),
    body:(loadMsg?loadMsg+' ':'')+(isBase?'준비된 사진으로 바로 시작해요.':'사진은 이 폰 안에서만 쓰이고 어디에도 올라가지 않아요. 여러 장을 고르면 한 장씩 스테이지가 돼요.'),buttons:bt});loadMsg='';
  var tb=document.createElement('div');tb.className='tabs tx';
  [['mine','내 사진'],['base','기본 사진']].forEach(function(a){var b=document.createElement('button');b.type='button';b.textContent=a[1];if(setupTab===a[0])b.className='on';b.addEventListener('click',function(){showSetup(a[0]);});tb.appendChild(b);});
  var lg=$('oL');lg.innerHTML='';
  if(isBase){
    lg.hidden=false;
    BASE.forEach(function(m){var d=document.createElement('div');d.className='th big';var im=document.createElement('img');im.src=m.th;im.alt=m.name;d.appendChild(im);lg.appendChild(d);});
    return;
  }
  lg.hidden=!n;
  mine.forEach(function(m,i){
    var d=document.createElement('div');d.className='th';
    var im=document.createElement('img');im.src=m.src;im.alt=m.name;d.appendChild(im);
    var x=document.createElement('button');x.type='button';x.textContent='✕';x.setAttribute('aria-label',m.name+' 빼기');
    x.addEventListener('click',function(){mine.splice(i,1);showSetup();});
    d.appendChild(x);lg.appendChild(d);
  });
}
function startMine(){
  if(!mine.length)return;
  var list=mine.map(function(m){return{name:m.name,photo:true,mine:true,line:'벽돌 뒤에 숨어 있던 사진이에요.',draw:function(c){
    fitDraw(c,m.im,m.im.width,m.im.height);
  }};});
  playlist=withBase?list.concat(BASE):list;
  newGame();
}
var loadMsg='';
$('file').addEventListener('change',function(e){
  var fs=Array.prototype.slice.call(e.target.files||[]);
  try{e.target.value='';}catch(err){}
  if(!fs.length)return;
  var left=0,fail=0;
  function done(){
    left--;
    if(left>0)return;
    if(autoStart&&mine.length){autoStart=false;startMine();}
    else{autoStart=false;loadMsg=fail?'사진 '+fail+'장을 읽지 못했어요. JPG나 PNG로 다시 시도해 주세요.':'';showSetup();}
  }
  fs.forEach(function(f){
    if(mine.length+left>=10)return;
    left++;
    var url=URL.createObjectURL(f),im=new Image();
    im.onerror=function(){fail++;try{URL.revokeObjectURL(url);}catch(err){}done();};
    im.onload=function(){
      var mx=Math.max(im.naturalWidth,im.naturalHeight),k=mx>1600?1600/mx:1;
      var cw=Math.max(1,Math.round(im.naturalWidth*k)),ch=Math.max(1,Math.round(im.naturalHeight*k));
      var c2=document.createElement('canvas');c2.width=cw;c2.height=ch;c2.getContext('2d').drawImage(im,0,0,cw,ch);
      mine.push({name:(f.name.replace(/\.[^.]+$/,'')||'내 사진').slice(0,20),im:c2,src:url});
      done();
    };
    im.src=url;
  });
  if(left===0)showSetup();
});

/* ---------- 입력 ---------- */
function lx(e){var r=cv.getBoundingClientRect();return(e.clientX-r.left)/r.width*W;}
cv.addEventListener('pointerdown',function(e){
  audio();pointerActive=true;tx=lx(e);firing=true;pendFire=1;
  try{cv.setPointerCapture(e.pointerId);}catch(err){}
  if(state==='ready')launch();
});
cv.addEventListener('pointermove',function(e){
  if(e.pointerType==='mouse'||pointerActive){tx=lx(e);pointerActive=true;}
});
function up(e){firing=false;if(e.pointerType!=='mouse')pointerActive=false;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){keys.l=1;pointerActive=false;e.preventDefault();}
  else if(k==='ArrowRight'||k==='d'||k==='D'){keys.r=1;pointerActive=false;e.preventDefault();}
  else if(k===' '&&state==='play'){firing=true;pendFire=1;e.preventDefault();}
  else if((k===' '||k==='Enter')&&state==='ready'&&!(e.target.closest&&e.target.closest('button'))){audio();launch();e.preventDefault();}
});
window.addEventListener('keyup',function(e){
  var k=e.key;
  if(k===' ')firing=false;
  if(k==='ArrowLeft'||k==='a'||k==='A')keys.l=0;
  else if(k==='ArrowRight'||k==='d'||k==='D')keys.r=0;
});
$('bMute').addEventListener('click',function(){
  muted=!muted;this.classList.toggle('off',muted);var lb=muted?'소리 켜기':'소리 끄기';this.setAttribute('aria-label',lb);this.title=lb;this.setAttribute('aria-pressed',muted?'true':'false');if(!muted){audio();tone(520,.08,'triangle',.06);}
});
$('bRestart').addEventListener('click',function(){audio();newGame();});
$('bPhoto').addEventListener('click',function(){audio();autoStart=false;showSetup();});

/* ---------- 루프 ---------- */
var last=0,acc=0;
function frame(t){
  requestAnimationFrame(frame);
  var dt=Math.min(.05,(t-last)/1000||.016);last=t;
  if(state==='play'||state==='ready'){acc+=dt;while(acc>=STEP){step(STEP);acc-=STEP;if(state!=='play'&&state!=='ready')break;}}
  else acc=0;
  fx(dt);draw(t);
}
loadStage(0);hud();showTitle();
requestAnimationFrame(frame);
})();
</script>
